<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>語塊筆記</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;
  --accent:#2f6fde;--accent-soft:#e7efff;--star:#d99400;
  --chunk:#2f6fde;--word:#1b8a5a;--pattern:#a24bc9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16171a;--card:#1f2125;--fg:#ececee;--muted:#9a9ba1;--line:#2e3036;
    --accent:#6ea0ff;--accent-soft:#22304a;--star:#f2b33d;
    --chunk:#6ea0ff;--word:#4cc38a;--pattern:#c98ae6;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{flex:1;margin:0;font-size:18px;font-weight:650;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:none;padding:6px 8px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--muted)}
.iconbtn:active{background:var(--line)}
main{max-width:720px;margin:0 auto;padding:12px 12px 120px}
.empty{color:var(--muted);text-align:center;padding:48px 16px}

/* bookshelf */
.book{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.book .t{font-weight:650;font-size:17px}
.book .m{color:var(--muted);font-size:13px;margin-top:2px}

/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit;margin-bottom:8px}

/* segments & items */
.seg{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
.seg h2{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.seg .top{font-size:13px;color:var(--star)}
.cat{font-size:13px;font-weight:650;margin:12px 4px 6px}
.cat.chunk{color:var(--chunk)}.cat.word{color:var(--word)}.cat.pattern{color:var(--pattern)}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin:0 0 8px}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.ck{flex:none;width:26px;height:26px;margin-top:1px;border:2px solid var(--muted);border-radius:7px;
  background:none;cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;padding:0}
.item.sel .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.body{flex:1;min-width:0;cursor:pointer}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.term{font-weight:650;font-size:16.5px}
.star{color:var(--star);font-size:13px}
.ipa{color:var(--muted);font-size:14px;font-family:"Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.pos{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.mean{margin-top:2px}
.more{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px}
.item.open .more{display:block}
.more p{margin:0 0 6px}
.more b{color:var(--muted);font-weight:600;font-size:13px;margin-right:4px}
.ex{font-style:italic}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;align-items:center}
.bar .cnt{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="back" aria-label="回書架" hidden>‹</button>
  <h1 id="title">語塊筆記</h1>
  <button class="iconbtn" id="rename" aria-label="改書名" hidden>✎</button>
  <button class="iconbtn" id="reload" aria-label="重新載入">↻</button>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden>
  <span class="cnt" id="cnt">未勾選</span>
  <button class="btn" id="clear">清除</button>
  <button class="btn primary" id="copy">複製編號</button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const main = $('#main');
  const CAT = {chunk:'語塊與搭配詞', word:'進階單字', pattern:'值得模仿的句型'};
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
  const fresh = url => fetch(url + '?t=' + Date.now(), {cache:'no-store'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });

  let books = [], book = null, sel = new Set(), filter = 'all', query = '', openAll = false;

  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
  const titleOf = b => store.get('vocabTitle:' + b.id, null) || b.title;

  async function route(){
    const id = new URLSearchParams(location.search).get('book');
    try{
      books = await fresh('books.json');
    }catch(e){ main.replaceChildren(el('p','empty','載入失敗，請檢查網路後按 ↻')); return; }
    if(id && books.some(b => b.id === id)) return openBook(id);
    showShelf();
  }

  function showShelf(){
    book = null;
    $('#title').textContent = '語塊筆記';
    $('#back').hidden = $('#rename').hidden = true; $('#bar').hidden = true;
    document.title = '語塊筆記';
    main.replaceChildren();
    if(!books.length){ main.append(el('p','empty','還沒有書')); return; }
    [...books].sort((a,b) => (b.created||'').localeCompare(a.created||'')).forEach(b => {
      const btn = el('button','book');
      btn.append(el('div','t', titleOf(b)));
      const n = store.get('vocabSel:' + b.id, []).length;
      btn.append(el('div','m', `${b.count||0} 個項目 · ${b.segments||0} 段 · ${b.created||''}` + (n ? ` · 已勾 ${n}` : '')));
      btn.onclick = () => { history.pushState(null,'','?book=' + encodeURIComponent(b.id)); openBook(b.id); };
      main.append(btn);
    });
  }

  async function openBook(id){
    const meta = books.find(b => b.id === id);
    try{ book = await fresh('books/' + meta.file); }
    catch(e){ main.replaceChildren(el('p','empty','載入失敗，請按 ↻ 重試')); return; }
    sel = new Set(store.get('vocabSel:' + id, []));
    $('#back').hidden = $('#rename').hidden = false; $('#bar').hidden = false;
    setTitle();
    render();
  }
  function setTitle(){ const t = titleOf(book); $('#title').textContent = t; document.title = t + '｜語塊筆記'; }
  const save = () => { store.set('vocabSel:' + book.id, [...sel].sort((a,b)=>a-b)); updateBar(); };

  function render(){
    main.replaceChildren();
    const tools = el('div','tools');
    [['all','全部'],['chunk','語塊'],['word','單字'],['pattern','句型'],['sel','已勾選']].forEach(([k,label]) => {
      const c = el('button','chip' + (filter===k?' on':''), label);
      c.onclick = () => { filter = k; render(); };
      tools.append(c);
    });
    const ex = el('button','chip' + (openAll?' on':''), openAll ? '收合' : '展開全部');
    ex.onclick = () => { openAll = !openAll; render(); };
    tools.append(ex);
    const search = el('input','search'); search.type = 'search'; search.placeholder = '搜尋單字、中文或編號'; search.value = query;
    search.oninput = () => { query = search.value.trim().toLowerCase(); renderList(list); };
    const list = el('div');
    main.append(search, tools, list);
    renderList(list);
    updateBar();
  }

  function match(it){
    if(filter === 'sel' && !sel.has(it.n)) return false;
    if(filter !== 'all' && filter !== 'sel' && it.cat !== filter) return false;
    if(!query) return true;
    return [String(it.n), it.term, it.meaning, it.usage, it.example, it.trans].some(s => (s||'').toLowerCase().includes(query));
  }

  function renderList(list){
    list.replaceChildren();
    let shown = 0;
    (book.segments||[]).forEach(seg => {
      const items = seg.items.filter(match);
      if(!items.length) return;
      const top = new Set(seg.top||[]);
      const h = el('div','seg'); h.append(el('h2',null,`第 ${seg.seg} 段（#${seg.items[0].n}–#${seg.items[seg.items.length-1].n}）`));
      if(seg.top && seg.top.length){
        const tb = el('button','chip', '⭐ 勾選推薦 ' + seg.top.map(n=>'#'+n).join(' '));
        tb.style.marginLeft = 'auto'; tb.style.fontSize = '12px';
        tb.onclick = () => { seg.top.forEach(n => sel.add(n)); save(); renderList(list); };
        h.append(tb);
      }
      list.append(h);
      let lastCat = null;
      items.forEach(it => {
        if(it.cat !== lastCat){ list.append(el('div','cat ' + it.cat, CAT[it.cat] || it.cat)); lastCat = it.cat; }
        list.append(itemEl(it, top.has(it.n)));
        shown++;
      });
    });
    if(!shown) list.append(el('p','empty', filter==='sel' ? '還沒有勾選任何項目' : '沒有符合的項目'));
  }

  function itemEl(it, isTop){
    const row = el('div','item' + (sel.has(it.n)?' sel':'') + (openAll?' open':''));
    const ck = el('button','ck', sel.has(it.n) ? '✓' : ''); ck.setAttribute('aria-label','勾選 #' + it.n);
    ck.onclick = () => {
      if(sel.has(it.n)) sel.delete(it.n); else sel.add(it.n);
      row.classList.toggle('sel', sel.has(it.n)); ck.textContent = sel.has(it.n) ? '✓' : ''; save();
    };
    const body = el('div','body');
    const head = el('div','head');
    head.append(el('span','num','#' + it.n), el('span','term', it.term));
    if(isTop) head.append(el('span','star','⭐'));
    if(it.ipa) head.append(el('span','ipa', it.ipa));
    if(it.pos) head.append(el('span','pos', it.pos));
    body.append(head, el('div','mean', it.meaning || ''));
    const more = el('div','more');
    const p = (label, text, cls) => { if(!text) return; const e = el('p', cls); e.append(el('b',null,label), document.createTextNode(text)); more.append(e); };
    p('用法', it.usage); p('例句', it.example, 'ex'); p('翻譯', it.trans);
    body.append(more);
    body.onclick = () => row.classList.toggle('open');
    row.append(ck, body);
    return row;
  }

  function updateBar(){
    if(!book) return;
    const nums = [...sel].sort((a,b)=>a-b);
    $('#cnt').textContent = nums.length ? `已勾 ${nums.length} 個：` + nums.map(n=>'#'+n).join(' ') : '未勾選';
    $('#copy').disabled = $('#clear').disabled = !nums.length;
  }

  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      const ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
    }
  }
  $('#copy').onclick = async () => {
    const nums = [...sel].sort((a,b)=>a-b);
    if(!nums.length) return;
    const text = nums.join(', ');
    toast(await copyText(text) ? `已複製 ${nums.length} 個編號` : '複製失敗：' + text);
  };
  $('#clear').onclick = () => { if(confirm('清除這本書的所有勾選？')){ sel.clear(); save(); render(); } };
  $('#rename').onclick = () => {
    const t = prompt('書名', titleOf(book));
    if(t == null) return;
    const v = t.trim();
    if(!v || v === book.title) localStorage.removeItem('vocabTitle:' + book.id); else store.set('vocabTitle:' + book.id, v);
    setTitle();
  };
  $('#back').onclick = () => { history.pushState(null,'',location.pathname); filter='all'; query=''; showShelf(); };
  $('#reload').onclick = () => route().then(() => toast('已更新'));
  window.addEventListener('popstate', route);
  route();
})();
</script>
</body>
</html>
